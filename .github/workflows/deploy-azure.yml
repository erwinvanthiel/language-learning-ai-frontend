name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: azure-static-web-apps-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ steps.deploy.outputs.static_web_app_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build PWA
        env:
          VITE_API_BASE_URL: ${{ github.ref_name == 'main' && 'https://language-learning-ai-api-evth.azurewebsites.net' || 'https://language-learning-ai-api-dev-evth.azurewebsites.net' }}
          VITE_GOOGLE_CLIENT_ID: 815295572197-qkb0jugsje2q719dmpvu5lf1jelpubuu.apps.googleusercontent.com
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          production_branch: main
