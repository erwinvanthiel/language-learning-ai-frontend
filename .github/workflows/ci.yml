name: CI

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build PWA
        env:
          VITE_API_BASE_URL: https://language-learning-ai-api-evth.azurewebsites.net
          VITE_GOOGLE_CLIENT_ID: 815295572197-qkb0jugsje2q719dmpvu5lf1jelpubuu.apps.googleusercontent.com
        run: npm run build
